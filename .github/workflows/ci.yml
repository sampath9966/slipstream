name: CI

on:
  push:
    branches: [main, "claude/*", "sampath/*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python3 -m pytest tests/ -v
      - name: Smoke-test engine
        run: |
          chmod +x bin/slipstream
          bin/slipstream doctor
          bin/slipstream report --json
